services:
  # CoffeeMaster API - Backend de Elite
  coffeemaster-api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: coffeemaster_api
    ports:
      - "1000:1000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./backend/coffeemaster_agent/inventory.json:/app/coffeemaster_agent/inventory.json
    restart: unless-stopped

  # CoffeeMaster Web - Frontend Desacoplado
  coffeemaster-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coffeemaster_web
    ports:
      - "80:80"
    depends_on:
      - coffeemaster-api
    restart: unless-stopped

  # ADK Web Lab (Debug e Testes)
  adk-lab:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adk_lab
    ports:
      - "1001:1001"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./backend/coffeemaster_agent/inventory.json:/app/coffeemaster_agent/inventory.json
    command: ["uv", "run", "adk", "web", "--port", "1001", "--host", "0.0.0.0"]
    restart: unless-stopped
